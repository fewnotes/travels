<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visited: US &amp; Canada</title>
<script>
  (function () {
    try {
      var saved = localStorage.getItem("visitedMap.test.pageTheme");
      document.documentElement.setAttribute("data-theme", saved === "light" ? "light" : "dark");
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  })();
</script>
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&display=swap">
</head>
<body>
<header class="site-header">
  <nav>
    <a href="https://travelblog.fewnotes.net/">trips</a>
    <a href="https://travelblog.fewnotes.net/about/">about</a>
    <a href="https://travels.fewnotes.net/">map</a>
  </nav>
  <div class="seg-switch" role="group" aria-label="Page theme">
    <button id="theme-light-btn" type="button">☀ Light</button>
    <button id="theme-dark-btn" type="button">☾ Dark</button>
  </div>
</header>

<header class="map-header">
  <h1>Places I've Visited</h1>
  <p class="subtitle" id="subtitle">Countries of the World</p>
</header>

<div class="controls">
  <div class="seg-switch" role="group" aria-label="Map view">
    <button id="view-state-btn" type="button" data-view-choice="state">US-Canada</button>
    <button id="view-world-btn" type="button" data-view-choice="world">World</button>
  </div>

  <span class="stat" id="stat-count"></span>
</div>

<div id="legend" class="legend"></div>

<main>
  <div id="map-wrap">
    <svg id="map"></svg>
    <div id="tooltip" class="tooltip" hidden></div>
  </div>

  <section id="visited-list-section" class="visited-list-section" hidden>
    <h2>Visited Countries</h2>
    <ul id="visited-list" class="visited-list"></ul>
  </section>
</main>

<footer>
  <p>Data: US boundaries via <a href="https://github.com/topojson/us-atlas" target="_blank" rel="noopener">us-atlas</a> (ISC, US Census Bureau); Canadian boundaries via <a href="https://github.com/codeforgermany/click_that_hood" target="_blank" rel="noopener">click_that_hood</a> (MIT); world boundaries via <a href="https://github.com/topojson/world-atlas" target="_blank" rel="noopener">world-atlas</a> (ISC, Natural Earth).</p>
</footer>

<script>var ASSET_BASE = "../";</script>
<script src="../assets/js/vendor/d3.min.js"></script>
<script src="../assets/js/data-p.js"></script>
<script src="../assets/js/map.js"></script>
</body>
</html>
